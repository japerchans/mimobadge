services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mimo
      POSTGRES_PASSWORD: mimo
      POSTGRES_DB: mimobadge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mimo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimo -d mimobadge"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  mimo-postgres:
